<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Progressive Web Application</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple progressive web application demo">
  <meta name="theme-color" content="#FF0000">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" sizes="180x180" href="img/icons/apple-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="img/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/icons/favicon-16x16.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles/myStyles.css">
  <script src="scripts/myScripts.js"></script>
</head>
<body>
  <h1>Simple Website</h1>
  <img src="https://bit.ly/3lFRKVb" alt="Galway" style="width:300px;height:500px;">
  <p id="paratxt" style="color:red">
    This is a HTML paragraph styled with CSS.<br>
    Press the HTML button below to run a JavaScript function<br>
    which will change the colour of this paragraph.
  </p>
  <button onclick="changeTextColor();">Click me to change paragraph text colour!</button>
  <script src="scripts/app.js" async></script>
</body>
</html>
